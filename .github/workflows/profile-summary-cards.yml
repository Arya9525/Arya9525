# Is file ko apni profile repo me is path par rakho: .github/workflows/profile-summary-cards.yml
# Ye action cards ko tumhari repo ke andar "profile-summary-card-output" folder me bana deta hai.
# Fir README me vercel wale link ki jagah raw link laga sakte ho (neeche README me kaise, wo bataya hai).

name: GitHub-Profile-Summary-Cards

on:
  schedule:
    # roz ek baar chalega
    - cron: "0 0 * * *"
  # Actions tab se manually bhi chala sakte ho
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Agar "Resource not accessible by integration" error aaye to
          # apna Personal Access Token repo secret me daalo (jaise SUMMARY_GITHUB_TOKEN)
          # aur yahan ${{ secrets.SUMMARY_GITHUB_TOKEN }} likh do
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          # branch jisme cards push honge
          BRANCH_NAME: "main"
          # India ke liye +5.5 (commit time card isi hisaab se banta hai)
          UTC_OFFSET: 5.5
